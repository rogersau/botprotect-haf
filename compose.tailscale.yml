services:
  tailscale:
    image: tailscale/tailscale:v1.104.1
    restart: unless-stopped
    network_mode: service:botprotect
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-botprotect}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale:/config:ro
    depends_on:
      botprotect:
        condition: service_healthy
        restart: true

volumes:
  tailscale-state:
